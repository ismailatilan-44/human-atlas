<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Atlas WebGL rendering probe</title>
<style>body{font:18px system-ui;max-width:780px;margin:48px auto;padding:16px;background:#f5f7fa;color:#162334}canvas{border:1px solid #8093aa;max-width:100%}pre{white-space:pre-wrap}button{padding:10px 18px}</style>
<h1>Atlas WebGL rendering probe</h1>
<p>A real context, shader draw and center-pixel readback. Pair this diagnostic with interaction in the actual Atlas viewer.</p>
<canvas width="480" height="320" aria-label="Rendered WebGL triangle"></canvas>
<p><button id="draw">Draw alternate color</button></p>
<pre id="result" role="status">Checking…</pre>
<script type="module">
const canvas = document.querySelector('canvas');
const result = document.querySelector('#result');
try {
  const gl = canvas.getContext('webgl', { preserveDrawingBuffer: true });
  if (!gl) throw new Error('WebGL context unavailable');
  const shader = (type, source) => {
    const s = gl.createShader(type);
    gl.shaderSource(s, source); gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
    return s;
  };
  const program = gl.createProgram();
  gl.attachShader(program, shader(gl.VERTEX_SHADER, 'attribute vec2 p; void main(){gl_Position=vec4(p,0.,1.);}'));
  gl.attachShader(program, shader(gl.FRAGMENT_SHADER, 'precision mediump float; uniform vec3 color; void main(){gl_FragColor=vec4(color,1.);}'));
  gl.linkProgram(program);
  if (!gl.getProgramParameter(program, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(program));
  gl.useProgram(program);
  gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-.8,-.8,.8,-.8,0,.8]), gl.STATIC_DRAW);
  const p = gl.getAttribLocation(program, 'p');
  gl.enableVertexAttribArray(p); gl.vertexAttribPointer(p,2,gl.FLOAT,false,0,0);
  let alternate = false;
  let draws = 0;
  function draw() {
    const expected = alternate ? [230,90,40] : [40,110,230];
    gl.uniform3fv(gl.getUniformLocation(program,'color'), expected.map(v=>v/255));
    gl.clearColor(.95,.97,.99,1); gl.clear(gl.COLOR_BUFFER_BIT);
    gl.drawArrays(gl.TRIANGLES,0,3);
    const pixel = new Uint8Array(4);
    gl.readPixels(240,160,1,1,gl.RGBA,gl.UNSIGNED_BYTE,pixel);
    const error = gl.getError();
    const pass = !gl.isContextLost() && error === gl.NO_ERROR && expected.every((v,i)=>Math.abs(v-pixel[i])<=2) && pixel[3] === 255;
    result.textContent = JSON.stringify({status:pass?'PASS':'FAIL',context:gl.getParameter(gl.VERSION),renderer:gl.getParameter(gl.RENDERER),contextLost:gl.isContextLost(),draws:++draws,expectedCenterRGBA:[...expected,255],actualCenterRGBA:[...pixel],glError:error},null,2);
  }
  document.querySelector('#draw').onclick = () => { alternate = !alternate; draw(); };
  canvas.addEventListener('webglcontextlost',()=>{result.textContent='FAIL: WebGL context lost';});
  draw();
} catch (error) { result.textContent = `FAIL: ${error.message}`; }
</script>
</html>
